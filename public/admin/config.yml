backend:
  name: github
  repo: storytold/craft-wiki
  branch: main
  api_root: https://craft.wiki/api/github
  base_url: https://craft.wiki
  auth_endpoint: api/auth
  auth_methods: [oauth, token]
  auth_scope: public_repo
  open_authoring: true
publish_mode: editorial_workflow
media_folder: public/assets/uploads
public_folder: /assets/uploads
collections:
  - name: artcraft-studio
    label: ArtCraft Studio
    folder: src/content/docs/apps/artcraft-studio
    publish_mode: simple
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
  - name: photocraft
