name: Worker tests

on:
  pull_request:
    paths: [worker/**, .github/workflows/worker-tests.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test worker/index.test.mjs
